<text x="94" y="496" text-anchor="middle" font-size="10.5" fill="#6B7280">痛点：口径不一致</text>
<text x="94" y="512" text-anchor="middle" font-size="10.5" fill="#6B7280">三岗时间须分开记</text>
<path d="M152 500 H160" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="3 2" fill="none"/>
