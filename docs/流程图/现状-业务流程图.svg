<rect x="160" y="474" width="5" height="52" rx="2" fill="#2E5FA3"/>
<text x="285" y="495" font-size="13" font-weight="500" fill="#1F2937">③ 前台办理入住</text>
<text x="285" y="514" font-size="11" fill="#5F6B76">高峰等待 38 分钟 → 目标 15 分钟</text>
