<rect x="0" y="0" width="680" height="920" fill="#FFFFFF"/>

<text x="36" y="32" font-family="Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="500" fill="#1F2937">酒店房态与入住协同 · 业务流程</text>
<text x="36" y="52" font-family="Microsoft YaHei, system-ui, sans-serif" font-size="11" fill="#8A94A0">山海旅居 / 客房-前台协同 · 基于 36 条访谈事实</text>
