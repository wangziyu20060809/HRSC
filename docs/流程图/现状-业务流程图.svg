<text x="400" y="452" font-family="Microsoft YaHei, system-ui, sans-serif" font-size="11" fill="#B05555">核实后重新判断</text>
<text x="288" y="462" font-family="Microsoft YaHei, system-ui, sans-serif" font-size="11" fill="#3B6D11">是</text>
<path d="M280 442 V470" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arw)"/>

