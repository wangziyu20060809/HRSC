<svg viewBox="0 0 680 920" width="680" height="920" xmlns="http://www.w3.org/2000/svg">
<title>酒店房态与入住协同业务流程</title>
<desc>退房到入住的主流程，含三处判断、右侧兜底分支与左侧痛点标注。</desc>
<defs>
<marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
