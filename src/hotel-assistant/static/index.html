<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>房态问答 · 员工入口</title>
<style>
  /* ---- 浅色专业风，与项目整体视觉一致 ---- */
  :root{
    --bg:#F4F6F8; --panel:#FFFFFF; --line:#E3E8ED;
    --ink:#1F2937; --sub:#5F6B76; --faint:#8A94A0;
    --primary:#0F4C5C; --primary-soft:#E7F0F2;
    --accent:#B07A16; --danger:#B23A2E; --ok:#2F7A4F;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column}
  header{background:var(--primary);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px}
  header .logo{background:#fff;color:var(--primary);font-weight:700;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center}
  header h1{font-size:16px;margin:0;font-weight:500}
  header .mode{margin-left:auto;font-size:12px;opacity:.85}
  .layout{flex:1;display:flex;min-height:0}
  /* 左侧会话列表 */
  .side{width:220px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
  .side .new{margin:12px;padding:9px 0;border:1px dashed var(--primary);color:var(--primary);background:var(--primary-soft);border-radius:8px;cursor:pointer;font-size:13px}
  .side .new:hover{filter:brightness(.97)}
  .sessions{flex:1;overflow-y:auto}
  .session{padding:10px 14px;font-size:13px;color:var(--sub);cursor:pointer;border-left:3px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .session:hover{background:#F7F9FA}
  .session.active{background:var(--primary-soft);border-left-color:var(--primary);color:var(--ink)}
  /* 右侧聊天区 */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .msgs{flex:1;overflow-y:auto;padding:20px}
  .msg{max-width:760px;margin:0 auto 16px;display:flex;gap:10px}
  .avatar{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
  .msg.user .avatar{background:#DDE5EA;color:var(--primary)}
  .msg.bot .avatar{background:var(--primary);color:#fff}
  .bubble{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:14px;line-height:1.75;white-space:pre-wrap;word-break:break-word;min-width:60px;max-width:100%}
  .msg.user .bubble{background:var(--primary-soft);border-color:#D3E2E6}
  /* 打字光标 */
  .caret{display:inline-block;width:8px;height:16px;background:var(--primary);vertical-align:-2px;animation:blink .8s step-end infinite}
  @keyframes blink{50%{opacity:0}}
  /* 检索状态条 */
  .status{color:var(--faint);font-size:12px;margin-top:6px;display:flex;align-items:center;gap:6px}
  .status .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:blink 1s infinite}
  .status.degraded{color:var(--accent)}
  /* 引用卡 */
  .cites{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
  .cites .label{font-size:12px;color:var(--faint);margin-bottom:6px}
  .cite{background:#FAFBFC;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px}
  .cite summary{cursor:pointer;font-size:12px;color:var(--primary);list-style:none}
  .cite summary::-webkit-details-marker{display:none}
  .cite .snippet{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.7;border-left:3px solid var(--line);padding-left:8px}
  /* 错误气泡 */
  .err{background:#FBEDEB;border-color:#EFC9C4;color:var(--danger);font-size:13px}
  .retry{margin-top:8px;font-size:12px;color:var(--primary);cursor:pointer;text-decoration:underline}
  /* 输入区 */
  .composer{border-top:1px solid var(--line);background:var(--panel);padding:14px 20px}
  .composer .row{max-width:760px;margin:0 auto;display:flex;gap:10px}
  textarea{flex:1;resize:none;height:52px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;font-family:inherit;outline:none}
  textarea:focus{border-color:var(--primary)}
  textarea:disabled{background:#F1F3F5}
  button.send{width:88px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-size:14px;cursor:pointer}
  button.send:disabled{background:#9FB3B9;cursor:not-allowed}
  .hint{max-width:760px;margin:6px auto 0;font-size:12px;color:var(--faint)}
</style>
</head>
<body>

<header>
  <div class="logo">房</div>
  <h1>房态问答 · 员工入口</h1>
  <span class="mode" id="mode"></span>
</header>

<div class="layout">
  <!-- 左侧：会话列表 -->
  <aside class="side">
    <button class="new" onclick="newSession()">＋ 新会话</button>
    <div class="sessions" id="sessions"></div>
  </aside>

  <!-- 右侧：聊天区 -->
  <div class="main">
    <div class="msgs" id="msgs"></div>
    <div class="composer">
      <div class="row">
        <textarea id="input" placeholder="输入制度相关问题，例如：维修房解除封锁需要什么证据？（Enter 发送，Shift+Enter 换行）"></textarea>
        <button class="send" id="sendBtn" onclick="send()">发送</button>
      </div>
      <div class="hint">回答仅依据已入库的制度条款生成，底部附引用出处；未配置大模型时自动降级为条款摘要。</div>
    </div>
  </div>
</div>

<script>
/* =====================================================================
 * 全局状态
 * ===================================================================== */
let sessionId = null;      // 当前会话 ID
let sending = false;       // 是否有回答进行中（禁用输入，防串话）

const msgsEl = document.getElementById('msgs');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');

/* =====================================================================
 * 工具：创建 DOM 元素（比拼字符串安全，避免注入）
 * ===================================================================== */
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

/* =====================================================================
 * 初始化：检查服务状态 → 加载会话列表 → 恢复最近会话
 * ===================================================================== */
async function boot() {
  // 健康检查：未配置大模型时，在标题栏提示当前为摘要模式
  try {
    const h = await (await fetch('/healthz')).json();
    document.getElementById('mode').textContent = h.llm_ready ? 'AI 模式' : '检索摘要模式（未配置大模型）';
  } catch (_) { /* 健康检查失败不阻塞使用 */ }

  const data = await (await fetch('/sessions')).json();
  renderSessions(data.sessions);
  if (data.sessions.length) {
    await openSession(data.sessions[0].id);  // 默认打开最近会话
  } else {
    await newSession();
  }
}

/* 渲染左侧会话列表 */
function renderSessions(list) {
  const box = document.getElementById('sessions');
  box.innerHTML = '';
  list.forEach(s => {
    const item = el('div', 'session' + (s.id === sessionId ? ' active' : ''), s.title || '新会话');
    item.onclick = () => openSession(s.id);
    box.appendChild(item);
  });
}

/* 新建会话 */
async function newSession() {
  const s = await (await fetch('/sessions', {method: 'POST'})).json();
  sessionId = s.session_id;
  msgsEl.innerHTML = '';
  addBotText('你好，我是房态制度问答助手。可以问我：房态标记规则、交接单要求、维修房处理、隐私留存等问题。');
  await refreshSessions();
}

/* 打开历史会话并恢复消息（含引用） */
async function openSession(sid) {
  sessionId = sid;
  msgsEl.innerHTML = '';
  const data = await (await fetch(`/sessions/${sid}/messages`)).json();
  data.messages.forEach(m => {
    if (m.role === 'user') addUserText(m.content);
    else addBotText(m.content, m.citations);
  });
  await refreshSessions();
  scrollBottom();
}

async function refreshSessions() {
  const data = await (await fetch('/sessions')).json();
  renderSessions(data.sessions);
}

/* =====================================================================
 * 消息气泡
 * ===================================================================== */
function addUserText(text) {
  const row = el('div', 'msg user');
  row.appendChild(el('div', 'bubble', text));
  row.appendChild(el('div', 'avatar', '我'));
  row.style.flexDirection = 'row-reverse';
  msgsEl.appendChild(row);
}

/* 助手气泡：返回各部分的引用，供流式过程中逐步填充 */
function addBotText(text, citations) {
  const row = el('div', 'msg bot');
  row.appendChild(el('div', 'avatar', 'AI'));
  const bubble = el('div', 'bubble');
  const body = el('span', 'body', text || '');
  bubble.appendChild(body);
  row.appendChild(bubble);
  msgsEl.appendChild(row);
  if (citations && citations.length) renderCites(bubble, citations);
  scrollBottom();
  return {row, bubble, body};
}

/* 在回答底部渲染可展开的引用卡（文件名 + 版本 + 条款号 + 片段） */
function renderCites(bubble, citations) {
  const box = el('div', 'cites');
  box.appendChild(el('div', 'label', '📄 引用制度条文'));
  citations.forEach(c => {
    const card = el('details', 'cite');
    const sum = el('summary', '', `${c.doc_title} · ${c.version} · ${c.clause_no}`);
    card.appendChild(sum);
    card.appendChild(el('div', 'snippet', c.snippet));
    box.appendChild(card);
  });
  bubble.appendChild(box);
}

function scrollBottom() { msgsEl.scrollTop = msgsEl.scrollHeight; }

/* =====================================================================
 * 发送问题 → 消费 SSE 流
 * ===================================================================== */
async function send() {
  const question = inputEl.value.trim();
  if (!question || sending || !sessionId) return;

  sending = true;
  inputEl.value = '';
  inputEl.disabled = true;
  sendBtn.disabled = true;

  addUserText(question);
  const {bubble, body} = addBotText('');

  // 检索状态条（"正在检索制度…"）
  const status = el('div', 'status');
  status.appendChild(el('span', 'dot'));
  const statusText = el('span', '', '正在检索制度…');
  status.appendChild(statusText);
  bubble.appendChild(status);
  // 打字光标
  const caret = el('span', 'caret');
  body.appendChild(caret);
  scrollBottom();

  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session_id: sessionId, question})
    });

    // 前置错误（非 SSE）：统一 {code,message} 结构，直接展示中文信息
    if (!resp.ok || (resp.headers.get('content-type') || '').includes('application/json')) {
      const err = await resp.json();
      showError(bubble, err.message || '请求失败，请稍后重试', question);
      return;
    }

    // —— SSE 解析：按空行分帧，逐事件处理 ——
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});

      const frames = buffer.split('\n\n');   // SSE 以空行分隔事件
      buffer = frames.pop();                  // 最后一段可能不完整，留到下轮

      for (const frame of frames) {
        const eventMatch = frame.match(/^event: (.+)$/m);
        const dataMatch = frame.match(/^data: (.*)$/m);
        if (!eventMatch || !dataMatch) continue;
        const event = eventMatch[1];
        const data = JSON.parse(dataMatch[1]);

        if (event === 'token') {
          // 打字机：逐段追加文本
          caret.before(document.createTextNode(data.text));
        } else if (event === 'citations') {
          renderCites(bubble, data);
        } else if (event === 'status' && data.stage === 'degraded') {
          statusText.textContent = data.text;
          status.classList.add('degraded');
        } else if (event === 'error') {
          showError(bubble, data.message, question);
          return;
        }
        // done 事件：流自然结束，无需额外处理
      }
      scrollBottom();
    }
  } catch (e) {
    showError(bubble, '网络异常，请检查服务是否启动后重试', question);
  } finally {
    // 清理状态条与光标，恢复输入
    status.remove();
    caret.remove();
    sending = false;
    inputEl.disabled = false;
    sendBtn.disabled = false;
    inputEl.focus();
    refreshSessions();
    scrollBottom();
  }
}

/* 错误展示：中文信息 + 重试按钮 */
function showError(bubble, message, question) {
  bubble.classList.add('err');
  bubble.textContent = message;
  const retry = el('div', 'retry', '点击重试');
  retry.onclick = () => { bubble.remove(); inputEl.value = question; send(); };
  bubble.appendChild(retry);
}

/* Enter 发送，Shift+Enter 换行 */
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

boot();
</script>
</body>
</html>
