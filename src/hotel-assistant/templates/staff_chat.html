<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>制度问答 · 酒店房态管理</title>
<link rel="stylesheet" href="/static/admin.css">
<style>
  /* 员工制度问答：左侧会话列表 + 右侧流式对话（与客人端同一引擎） */
  .qa{display:flex;gap:16px;align-items:flex-start}
  .sessions{width:250px;flex-shrink:0}
  .sess-item{padding:9px 10px;border-radius:8px;font-size:13px;cursor:pointer;
             color:#5F6B76;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sess-item.on{background:#E7F0F2;color:#0F4C5C;font-weight:500}
  .chat{flex:1;background:#fff;border:1px solid #E3E8ED;border-radius:10px;
        display:flex;flex-direction:column;height:560px}
  .msgs{flex:1;overflow-y:auto;padding:16px}
  .msg{max-width:82%;margin-bottom:14px;font-size:13.5px;line-height:1.8}
  .msg.user{margin-left:auto;background:#0F4C5C;color:#fff;border-radius:12px 12px 2px 12px;padding:9px 13px}
  .msg.ai{background:#F4F6F8;border-radius:12px 12px 12px 2px;padding:9px 13px}
  .status{font-size:12.5px;color:#8A94A0;padding:0 16px 6px}
  .cites{margin-top:8px}
  .cite{border:1px solid #E3E8ED;border-left:3px solid #B07A16;border-radius:8px;
        background:#fff;padding:7px 10px;margin-top:6px;font-size:12px;color:#5F6B76}
  .cite b{color:#1F2937;display:block;margin-bottom:2px}
  .composer{border-top:1px solid #E3E8ED;padding:12px;display:flex;gap:10px}
  .composer textarea{flex:1;border:1px solid #E3E8ED;border-radius:10px;padding:9px 12px;
                     font-size:13.5px;font-family:inherit;resize:none;height:44px;outline:none}
  .composer button{border:none;border-radius:10px;background:#0F4C5C;color:#fff;
                   font-size:13.5px;padding:0 20px;cursor:pointer}
  .composer button:disabled{background:#9FB3B9;cursor:not-allowed}
</style>
</head>
<body>
<div class="admin-layout">
  <aside class="sidenav">
    <div class="brand"><span class="logo">房</span> 员工工作台</div>
    <nav>
      <a href="/staff">人工工单</a>
      <a href="/staff/chat" class="on">制度问答</a>
    </nav>
    <div class="sidenav-foot">
      <div>{{ user.display_name }}（员工）</div>
      <a href="javascript:logout()">退出登录</a>
    </div>
  </aside>

  <main class="content">
    <header class="topbar"><span class="crumb">制度问答 · 检索《客房管理制度》并流式回答</span></header>
    <div class="content-inner">
      <div class="qa">
        <div class="panel sessions">
          <h3>历史会话 <button class="btn sm" style="float:right" onclick="newSession()">新建</button></h3>
          <div id="sessList"><p style="color:#8A94A0;font-size:12.5px">加载中…</p></div>
        </div>

        <div class="chat">
          <div class="msgs" id="msgs"></div>
          <div class="status" id="status"></div>
          <div class="composer">
            <textarea id="q" placeholder="请输入制度问题，例如：OOO 房维修期间可以出售吗？" maxlength="500"></textarea>
            <button id="send" onclick="send()">发送</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<script>
/* 员工问答与客人端共用 chat_engine：SSE 事件序列完全一致 */
let sid = '';

async function loadSessions() {
  const data = await (await fetch('/sessions')).json();
  const box = document.getElementById('sessList');
  box.innerHTML = '';
  for (const s of data.sessions) {
    const div = document.createElement('div');
    div.className = 'sess-item' + (s.id === sid ? ' on' : '');
    div.textContent = s.title || '新会话';
    div.title = s.title;
    div.onclick = () => { sid = s.id; loadSessions(); loadMessages(); };
    box.appendChild(div);
  }
  if (!sid && data.sessions.length) sid = data.sessions[0].id;
}

async function newSession() {
  const data = await (await fetch('/sessions', {method: 'POST'})).json();
  sid = data.session_id;
  document.getElementById('msgs').innerHTML = '';
  loadSessions();
}

async function loadMessages() {
  const data = await (await fetch(`/sessions/${sid}/messages`)).json();
  const box = document.getElementById('msgs');
  box.innerHTML = '';
  for (const m of data.messages) renderMsg(m.role, m.content, m.citations);
  loadSessions();
}

function renderMsg(role, content, citations) {
  const box = document.getElementById('msgs');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if (role === 'ai') {
    div.innerHTML = '<div class="body"></div><div class="cites"></div>';
    div.querySelector('.body').textContent = content;
    if (citations) {
      try {
        const list = typeof citations === 'string' ? JSON.parse(citations) : citations;
        div.querySelector('.cites').innerHTML = (list || []).map(c =>
          `<div class="cite"><b>引用：${c.doc_title} · ${c.version} · ${c.clause_no}</b>${c.snippet}…</div>`
        ).join('');
      } catch { /* 引用非 JSON 时忽略 */ }
    }
  } else {
    div.textContent = content;
  }
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

async function readSSE(resp, handlers) {
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buf = '', event = '', data = '';
  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    buf += decoder.decode(value, {stream: true});
    let idx;
    while ((idx = buf.indexOf('\n\n')) >= 0) {
      const frame = buf.slice(0, idx); buf = buf.slice(idx + 2);
      event = ''; data = '';
      for (const line of frame.split('\n')) {
        if (line.startsWith('event:')) event = line.slice(6).trim();
        if (line.startsWith('data:')) data += line.slice(5).trim();
      }
      if (event && handlers[event]) {
        try { handlers[event](JSON.parse(data)); } catch { /* 忽略坏帧 */ }
      }
    }
  }
}

async function send() {
  const input = document.getElementById('q');
  const question = input.value.trim();
  if (!question || !sid) return;
  input.value = '';
  document.getElementById('send').disabled = true;
  renderMsg('user', question);
  document.getElementById('status').textContent = '';

  const resp = await fetch('/chat', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({session_id: sid, question}),
  });
  if (!resp.ok) {
    const data = await resp.json().catch(() => ({}));
    document.getElementById('status').textContent = data.message || '服务异常';
    document.getElementById('send').disabled = false;
    return;
  }
  // 正在生成的回答：正文打字机 + 引用卡片
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.innerHTML = '<div class="body"></div><div class="cites"></div>';
  document.getElementById('msgs').appendChild(div);
  const body = div.querySelector('.body');
  const cites = div.querySelector('.cites');
  await readSSE(resp, {
    status(d)  { document.getElementById('status').textContent = d.text || ''; },
    citations(list) {
      cites.innerHTML = list.map(c =>
        `<div class="cite"><b>引用：${c.doc_title} · ${c.version} · ${c.clause_no}</b>${c.snippet}…</div>`
      ).join('');
    },
    token(d)   { body.textContent += d.text; document.getElementById('msgs').scrollTop = 1e9; },
    error(d)   { document.getElementById('status').textContent = d.message; },
    done()     { document.getElementById('status').textContent = ''; loadSessions(); },
  });
  document.getElementById('send').disabled = false;
}

document.getElementById('q').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
async function logout() {
  await fetch('/auth/logout', {method: 'POST'});
  location.href = '/login';
}
newSession();   // 进入页面即开一个新会话，减少一步操作
</script>
</body>
</html>
