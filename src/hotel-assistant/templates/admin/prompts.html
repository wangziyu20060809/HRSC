{% extends "admin/base.html" %}
{% block title %}提示词模板{% endblock %}
{% block crumb %}提示词模板{% endblock %}
{% block content %}
<div class="content-inner">
  <div class="panel">
    <h3>默认系统提示词（存数据库，保存后下一条提问立即生效）</h3>
    <label>当前模板</label>
    <textarea id="prompt" maxlength="2000">{{ prompt }}</textarea>
    <div class="hint">建议包含：角色定位、只依据制度条文回答的原则、引用要求、禁止编造的内容。</div>
    <div style="margin-top:12px;display:flex;gap:10px">
      <button class="btn" onclick="save()">保存</button>
      <button class="btn ghost" onclick="reset()">恢复默认</button>
    </div>
  </div>

  <div class="panel">
    <h3>默认模板（仅供参考）</h3>
    <p style="font-size:13px;color:#5F6B76;line-height:1.8;background:#F4F6F8;border-radius:8px;padding:12px 14px">
      {{ default_prompt }}</p>
  </div>
</div>
{% endblock %}
{% block script %}
<script>
async function save() {
  const content = document.getElementById('prompt').value.trim();
  if (content.length < 10) { alert('模板至少 10 个字符'); return; }
  const resp = await fetch('/admin/api/prompts/default', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({content}),
  });
  const data = await resp.json();
  toast(resp.ok ? data.message : (data.message || '保存失败'));
}
async function reset() {
  if (!confirm('确认恢复默认模板？当前修改将丢失。')) return;
  const resp = await fetch('/admin/api/prompts/default/reset', {method: 'POST'});
  const data = await resp.json();
  if (!resp.ok) { alert(data.message || '恢复失败'); return; }
  toast(data.message);
  setTimeout(() => location.reload(), 800);
}
</script>
{% endblock %}
